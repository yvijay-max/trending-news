name: Update Telegram data

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -m pip install pytest && python -m pytest -q scraper/tests
      - name: Scrape channels and BTC price
        run: python scraper/scrape.py --pages 8
      - name: Manual imports (data/manual/*.csv)
        run: python scraper/manual_import.py
      - name: Group stats (optional, needs secrets)
        timeout-minutes: 40
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scraper/groups.py
      - name: Discord announcement channels (needs DISCORD_BOT_TOKEN)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scraper/discord_reader.py
      - name: Status pages (Coinbase, Kraken)
        run: python scraper/status.py
      - name: Hour-by-hour topics
        run: python scraper/hourly.py
      - name: Key findings
        run: python scraper/insights.py
      - name: Commit data
        run: |
          git config user.name "tg-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
