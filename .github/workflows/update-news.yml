name: Update news

on:
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the workflow save the new page to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata       # show times on the page in IST
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news and build page
        run: |
          python news_tracker.py
          mkdir -p public
          mv news_report.html public/index.html
          mv news_report.json public/news.json

      - name: Save updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --staged --quiet || git commit -m "Update news $(date +'%d %b %Y %H:%M IST')"
          git push
