name: Update news

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (GitHub uses UTC time)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the workflow save the new page to the repo

env:
  CF_PAGES_PROJECT: trending-news   # <-- change to your Cloudflare Pages project name

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata       # show times on the page in IST
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news and build page
        run: |
          python news_tracker.py
          mkdir -p public
          mv news_report.html public/index.html
          mv news_report.json public/news.json

      - name: Save updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --staged --quiet || git commit -m "Update news $(date +'%d %b %Y %H:%M IST')"
          git push

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
